# Windows: link the C runtime statically, so the installed app doesn't need
# the Visual C++ Redistributable (vcruntime140.dll). libopus (built with
# cmake by opusic-sys) follows this setting.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
