[package]
name = "orchard-music-player"
version = "1.1.0"
edition = "2024"
license = "MIT"
authors = ["Stephan Lengl <lengl.stephan@gmail.com>"]
rust-version = "1.90"
description = "A themeable, keyboard-friendly music player for your own music files"

[[bin]]
name = "orchard-music-player"
path = "src/main.rs"

[dependencies]
# Shared with the other Orchard apps (Orchard Commons), pinned to a release
# tag (for a local change to them, override with a [patch] section pointing
# at a checkout). The character-grid renderer (wgpu + winit).
orchard-grid = { git = "https://github.com/sandboxly/orchard-commons", tag = "v0.1.0" }
# Color schemes, frame styles and the color-schemes folder shared with
# Orchard Commander.
orchard-theme = { git = "https://github.com/sandboxly/orchard-commons", tag = "v0.1.0" }
# Background tasks, input events, grid widgets, dialog forms and the clipboard.
orchard-kit = { git = "https://github.com/sandboxly/orchard-commons", tag = "v0.1.0" }
# The window, event loop, command line and settings files.
orchard-shell = { git = "https://github.com/sandboxly/orchard-commons", tag = "v0.1.0" }
# Audio tag reading (the AudioTags provider).
orchard-metadata = { git = "https://github.com/sandboxly/orchard-commons", tag = "v0.1.0" }
symphonia = { version = "0.6", features = ["all"] }
# Opus (libopus, built from the bundled source).
symphonia-adapter-libopus = "0.3"
# Media keys and the system's Now Playing (MPRemoteCommandCenter, MPRIS, SMTC).
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }
cpal = "0.18.2"
rustfft = "6.4"
# Same version as orchard-metadata: stream properties and cover art.
lofty = "0.24"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }
serde = { version = "1.0", features = ["derive"] }
dirs = "6.0"
log = "0.4"

[target.'cfg(windows)'.dependencies]
# The drive list in the file browser (src/browser.rs).
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[build-dependencies]
# The Windows icon and version resource (build.rs).
embed-resource = "3"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
